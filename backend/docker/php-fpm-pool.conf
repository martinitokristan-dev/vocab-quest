; PHP-FPM Pool Configuration — tuned for Render Free (512MB RAM, 0.1 vCPU)
; Keeps a minimum of 2 pre-warmed workers so the first real request after a
; BetterStack ping doesn't have to cold-boot a new worker process.

[www]
user  = www-data
group = www-data

listen = 127.0.0.1:9000

; --- Process Manager ---
; "dynamic" keeps pm.min_spare_servers workers always alive so API calls don't
; wait for a fresh process to boot (the main cause of first-hit latency).
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 3

; Recycle workers after 500 requests to prevent memory leaks on free tier
pm.max_requests = 500

; Slow-request logging: flag anything slower than 10 s in php-fpm logs
request_slowlog_timeout = 10s
slowlog = /tmp/php-fpm-slow.log

; Pass environment variables from the Docker container into PHP workers
clear_env = no
