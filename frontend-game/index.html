<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var suppress = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message) || String(e))) || '';
          var src = (e && (e.filename || (e.reason && e.reason.stack))) || '';
          if (msg.indexOf('startTime') !== -1 || src.indexOf('VM') !== -1 || msg.indexOf('reportAllChanges') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);
        var prevOnError = window.onerror;
        window.onerror = function(msg, url) {
          var sMsg = String(msg || '');
          var sUrl = String(url || '');
          if (sMsg.indexOf('startTime') !== -1 || sUrl.indexOf('VM') !== -1 || sMsg.indexOf('reportAllChanges') !== -1) {
            return true;
          }
          if (typeof prevOnError === 'function') return prevOnError.apply(this, arguments);
        };
        var origConsoleError = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');
          if (str.indexOf('startTime') !== -1 || str.indexOf('reportAllChanges') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
    <script>
      // Phone with Chrome "Desktop site" on: the page is drawn 980px wide and scaled down, so the
      // game looks tiny. Detect it (touch, portrait, wide CSS viewport but a phone-sized physical
      // screen) and mark <html> so style.css enlarges the cards and buttons (--vqz = 980/412 ~ 2.4).
      (function () {
        function check() {
          try {
            var w = window.innerWidth, h = window.innerHeight, dpr = window.devicePixelRatio || 1;
            var touch = (navigator.maxTouchPoints || 0) > 0;
            var phoneScreen = (screen.width || 9999) < 820 || w * dpr <= 1600;
            var on = touch && h > w && w >= 900 && phoneScreen;
            var root = document.documentElement;
            root.classList.toggle('vq-desktop-phone', on);
            root.style.setProperty('--vqz', on ? String(Math.min(3, Math.max(1, w / 412))) : '1');
          } catch (e) {}
        }
        check();
        window.addEventListener('resize', check);
      })();
    </script>
