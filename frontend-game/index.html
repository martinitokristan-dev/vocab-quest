<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var suppress = function(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message) || String(e))) || '';
          var src = (e && (e.filename || (e.reason && e.reason.stack))) || '';
          if (msg.indexOf('startTime') !== -1 || src.indexOf('VM') !== -1 || msg.indexOf('reportAllChanges') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);
        var prevOnError = window.onerror;
        window.onerror = function(msg, url) {
          var sMsg = String(msg || '');
          var sUrl = String(url || '');
          if (sMsg.indexOf('startTime') !== -1 || sUrl.indexOf('VM') !== -1 || sMsg.indexOf('reportAllChanges') !== -1) {
            return true;
          }
          if (typeof prevOnError === 'function') return prevOnError.apply(this, arguments);
        };
        var origConsoleError = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');
          if (str.indexOf('startTime') !== -1 || str.indexOf('reportAllChanges') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0284C7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vocab Quest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Vocab Quest - An interactive vocabulary learning game" />
    <title>Vocab Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@400;500;600;700;800;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Preload the idle base sprite for each kingdom teacher at highest browser priority -->
    <link rel="preload" as="image" href="/assets/guide/F1.png" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/guide/G1.png" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/guide/teacher_yellow_pose1.png" fetchpriority="high">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Phone/tablet with Chrome "Desktop site" on: the browser ignores the mobile viewport and
      // draws a 980px desktop page, so every button and text looks tiny. Tell the pupil once per
      // tab how to switch it off (big text, because the page itself is drawn scaled down).
      (function () {
        try {
          var touch = (navigator.maxTouchPoints || 0) > 0;
          var small = (screen.width || 9999) < 820;
          if (!touch || !small || window.innerWidth < 960 || sessionStorage.getItem('vq_desktop_hint')) return;
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#FEF3C7;color:#78350F;border-bottom:6px solid #F59E0B;padding:28px 36px;font:700 40px/1.35 system-ui,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)';
          box.innerHTML = 'The game looks small because <b>Desktop site</b> is on.<br>Tap <b>&#8942;</b> (top right) and turn off <b>Desktop site</b>.' +
            '<br><button type="button" style="margin-top:18px;font:800 40px system-ui,sans-serif;padding:14px 48px;border:0;border-radius:18px;background:#16A34A;color:#fff">OK</button>';
          box.querySelector('button').onclick = function () {
            sessionStorage.setItem('vq_desktop_hint', '1');
            box.remove();
          };
          document.body.appendChild(box);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
